name: Mobile Release (APK & IPA)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Nomor Versi Rilis (contoh: v4.1.0)'
        required: true
        default: 'v4.1.0'
      release_title:
        description: 'Judul Rilis (contoh: Goalie v4.1.0 - PWA Mobile Release)'
        required: false
        default: 'Goalie v4.1.0 - PWA Mobile Release'
      release_notes:
        description: 'Keterangan perbaikan bug dan catatan rilis'
        required: false
        default: 'Pembaruan aplikasi mobile Goalie dengan perbaikan bug dan peningkatan performa.'
      prerelease:
        description: 'Tandai sebagai Pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_SLUG: 'Goalie'

jobs:
  # ========================================================
  # JOB 1: Build Android APK
  # ========================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: version_step
        run: |
          RAW_VER="${{ github.event.inputs.version }}"
          if [ -z "$RAW_VER" ]; then
            RAW_VER="${{ github.ref_name }}"
          fi
          if [ -z "$RAW_VER" ] || [ "$RAW_VER" = "main" ]; then
            RAW_VER="v4.1.0"
          fi
          if [[ ! "$RAW_VER" =~ ^v ]]; then
            RAW_VER="v${RAW_VER}"
          fi
          echo "VERSION=$RAW_VER" >> $GITHUB_ENV

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App & Sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Compile Android APK (assembleDebug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          TARGET_NAME="${{ env.APP_SLUG }}-${{ env.VERSION }}-Android.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$TARGET_NAME"
          echo "APK successfully created: $TARGET_NAME"
          ls -lh "$TARGET_NAME"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Goalie-*-Android.apk
          retention-days: 7

  # ========================================================
  # JOB 2: Build iOS IPA (Unsigned Archive)
  # ========================================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: version_step
        run: |
          RAW_VER="${{ github.event.inputs.version }}"
          if [ -z "$RAW_VER" ]; then
            RAW_VER="${{ github.ref_name }}"
          fi
          if [ -z "$RAW_VER" ] || [ "$RAW_VER" = "main" ]; then
            RAW_VER="v4.1.0"
          fi
          if [[ ! "$RAW_VER" =~ ^v ]]; then
            RAW_VER="v${RAW_VER}"
          fi
          echo "VERSION=$RAW_VER" >> $GITHUB_ENV

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App & Sync Capacitor iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Install CocoaPods Dependencies
        run: |
          cd ios/App
          pod install --repo-update || pod install

      - name: Compile and Archive iOS App (Unsigned)
        run: |
          mkdir -p build
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_FLAG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_FLAG="-project ios/App/App.xcodeproj"
          fi
          echo "Running xcodebuild archive with $TARGET_FLAG..."
          xcodebuild archive \
            $TARGET_FLAG \
            -scheme App \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Extract Payload and Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/App.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find .app in archive Products!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          TARGET_IPA="${{ env.APP_SLUG }}-${{ env.VERSION }}-iOS.ipa"
          zip -r -y "$TARGET_IPA" Payload
          rm -rf Payload
          echo "IPA successfully created: $TARGET_IPA"
          ls -lh "$TARGET_IPA"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Goalie-*-iOS.ipa
          retention-days: 7

  # ========================================================
  # JOB 3: Publish GitHub Release with Assets & Bugfix Notes
  # ========================================================
  release:
    name: Publish to GitHub Releases
    needs: [build-android, build-ios]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version & Metadata
        id: meta
        run: |
          RAW_VER="${{ github.event.inputs.version }}"
          if [ -z "$RAW_VER" ]; then
            RAW_VER="${{ github.ref_name }}"
          fi
          if [ -z "$RAW_VER" ] || [ "$RAW_VER" = "main" ]; then
            RAW_VER="v4.1.0"
          fi
          if [[ ! "$RAW_VER" =~ ^v ]]; then
            RAW_VER="v${RAW_VER}"
          fi
          
          TITLE="${{ github.event.inputs.release_title }}"
          if [ -z "$TITLE" ]; then
            TITLE="Goalie ${RAW_VER} - Mobile Release"
          fi
          
          echo "tag=$RAW_VER" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Create Download Staging Directory
        run: mkdir -p release-assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets
        continue-on-error: true

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-assets
        continue-on-error: true

      - name: List Release Assets
        run: |
          echo "Release Assets Ready for Upload:"
          ls -lh release-assets/

      - name: Compose Release Notes
        id: notes
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          NOTES="${{ github.event.inputs.release_notes }}"
          
          cat << 'EOF' > release_body.md
          ## 📱 Goalie Mobile App Release

          ### 🛠️ Keterangan Perbaikan Bug & Catatan Rilis
          EOF
          
          if [ -n "$NOTES" ]; then
            echo "$NOTES" >> release_body.md
          else
            echo "Pembaruan rilis mobile otomatis untuk aplikasi Goalie." >> release_body.md
          fi
          
          cat << 'EOF' >> release_body.md

          ---
          ### 📦 File Unduhan Aplikasi (Assets)
          - **Android APK**: Download file `.apk` di bawah dan instal langsung di smartphone Android Anda.
          - **iOS IPA**: Download file `.ipa` di bawah untuk instalasi melalui AltStore, SideStore, atau Sideloadly.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: release_body.md
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
