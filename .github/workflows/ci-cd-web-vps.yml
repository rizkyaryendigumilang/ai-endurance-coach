name: Web CI/CD to VPS (Manual Dispatch)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to VPS after validation; set false for dry-run validation'
        required: true
        type: boolean
        default: true
      base_path:
        description: 'Base path for build (e.g. / or /goalie/)'
        required: false
        type: string
        default: '/'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  APP_SLUG: 'goalie'
  VPS_TARGET_DIR: '/home/ubuntu/platform-repos/ai-endurance-coach'
  DEFAULT_BASE_PATH: '/'

jobs:
  build:
    name: Validate and build web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated Python unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests (if available)
        run: npm test --if-present

      - name: Build production web bundle
        env:
          CI: true
          BASE_PATH: ${{ inputs.base_path || env.DEFAULT_BASE_PATH }}
        run: npm run build

      - name: Validate build output integrity
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/login.html
          test -s dist/manifest.json
          test -s dist/sw.js
          echo "Web build integrity check passed."

      - name: Package web & application release artifact
        run: |
          set -euo pipefail
          # Package dist web assets, python backend, and configurations into clean staging location
          pkg_tmp="${RUNNER_TEMP:-/tmp}/pkg-stage-${GITHUB_SHA}"
          mkdir -p "$pkg_tmp"
          tar_exit=0
          tar --exclude='.git' \
              --exclude='node_modules' \
              --exclude='venv' \
              --exclude='.venv' \
              --exclude='__pycache__' \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='.runtime' \
              --exclude='android' \
              --exclude='ios' \
              --exclude='*.tar.gz' \
              --exclude='web-dist.tar.gz' \
              --warning=no-file-changed \
              -czf "$pkg_tmp/web-dist.tar.gz" . || tar_exit=$?

          # GNU tar exits with 1 if files changed while reading (non-fatal warning); >= 2 is fatal error
          if [ "$tar_exit" -ne 0 ] && [ "$tar_exit" -ne 1 ]; then
            echo "::error::tar archiving failed with fatal exit code: $tar_exit"
            exit "$tar_exit"
          fi

          mv "$pkg_tmp/web-dist.tar.gz" ./web-dist.tar.gz
          rm -rf "$pkg_tmp"
          test -s web-dist.tar.gz
          tar -tzf web-dist.tar.gz | grep 'index.html' > /dev/null
          tar -tzf web-dist.tar.gz | grep 'app/main.py' > /dev/null

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    name: Deploy web to production VPS
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && (inputs.deploy == true || inputs.deploy == 'true'))
      )
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ./artifact

      - name: Validate artifact integrity before deployment
        run: |
          set -euo pipefail
          test -s ./artifact/web-dist.tar.gz || { echo "::error::Artifact web-dist.tar.gz is missing or empty"; exit 1; }
          ARCHIVE_FILES=$(tar -tzf ./artifact/web-dist.tar.gz) || { echo "::error::Artifact is not a valid gzip tar archive"; exit 1; }
          echo "$ARCHIVE_FILES" | grep 'index.html' > /dev/null || { echo "::error::Archive missing index.html"; exit 1; }
          (cd ./artifact && sha256sum web-dist.tar.gz > web-dist.tar.gz.sha256)
          echo "Artifact validated. SHA256: $(cat ./artifact/web-dist.tar.gz.sha256)"

      - name: Validate secrets and configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}" || { echo "::error::Missing required secret: VPS_HOST"; exit 1; }
          test -n "${VPS_USER:-}" || { echo "::error::Missing required secret: VPS_USERNAME"; exit 1; }
          test -n "${VPS_KEY:-}" || { echo "::error::Missing required secret: VPS_SSH_KEY"; exit 1; }
          test -n "${VPS_SSH_KNOWN_HOSTS:-}" || { echo "::error::Missing required secret: VPS_SSH_KNOWN_HOSTS"; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          
          # Auto-detect working SSH port between VPS_PORT, 2222, and 22
          CHOSEN_PORT="$VPS_PORT"
          if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i "$HOME/.ssh/id_ed25519" -p "$CHOSEN_PORT" "$VPS_USER@$VPS_HOST" "true" 2>/dev/null; then
            echo "Port $CHOSEN_PORT did not respond. Testing alternative port 2222..."
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i "$HOME/.ssh/id_ed25519" -p 2222 "$VPS_USER@$VPS_HOST" "true" 2>/dev/null; then
              CHOSEN_PORT=2222
            elif ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i "$HOME/.ssh/id_ed25519" -p 22 "$VPS_USER@$VPS_HOST" "true" 2>/dev/null; then
              CHOSEN_PORT=22
            fi
          fi
          echo "Verified working SSH port: $CHOSEN_PORT"
          echo "ACTIVE_VPS_PORT=$CHOSEN_PORT" >> "$GITHUB_ENV"
          ssh-keyscan -p "$CHOSEN_PORT" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload release bundle and checksum to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ env.ACTIVE_VPS_PORT || secrets.VPS_SSH_PORT || '22' }}
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -P "$VPS_PORT" \
            ./artifact/web-dist.tar.gz \
            ./artifact/web-dist.tar.gz.sha256 \
            "$VPS_USER@$VPS_HOST:~/"

      - name: Atomic deployment with verified backup and rollback
        id: deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ env.ACTIVE_VPS_PORT || secrets.VPS_SSH_PORT || '22' }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "bash -s -- '${{ env.VPS_TARGET_DIR }}' '${{ env.APP_SLUG }}' '${RELEASE_SHA}'" <<'REMOTE'
          set -Eeuo pipefail
          live="$1"
          slug="$2"
          release="$3"
          parent="$HOME/.deploy-$slug"
          stage="$parent/stage-$release"
          backup="$parent/backup-$release.tar.gz"
          bundle="$HOME/web-dist.tar.gz"
          checksum="$HOME/web-dist.tar.gz.sha256"

          # 1. Verifikasi checksum bundle
          test -s "$bundle" || { echo "::error::Bundle missing on VPS"; exit 1; }
          test -s "$checksum" || { echo "::error::Checksum missing on VPS"; exit 1; }
          cd "$HOME"
          EXPECTED_SHA=$(awk '{print $1}' "$checksum")
          ACTUAL_SHA=$(sha256sum "$bundle" | awk '{print $1}')
          if [ -z "$EXPECTED_SHA" ] || [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "::error::Bundle SHA256 checksum mismatch on VPS: expected $EXPECTED_SHA, got $ACTUAL_SHA"
            exit 1
          fi

          mkdir -p "$parent"
          mkdir -p "$live"
          rm -rf "$stage"
          mkdir -p "$stage"

          deploy_success=0
          rollback() {
            local exit_code=$?
            if [ "$deploy_success" -eq 1 ]; then
              return 0
            fi
            echo "::error::Deployment failure detected (exit code: $exit_code). Initiating rollback..."
            if [ -f "$backup" ] && [ -s "$backup" ]; then
              echo "Restoring previous live version from verified backup: $backup ..."
              restore="$parent/restore-$release"
              rm -rf "$restore"
              mkdir -p "$restore"
              tar -xzf "$backup" -C "$restore"
              rsync -a --delete \
                --exclude='.git' \
                --exclude='venv' \
                --exclude='.venv' \
                --exclude='.env' \
                --exclude='.env.*' \
                --exclude='node_modules' \
                --exclude='__pycache__' \
                --exclude='.runtime' \
                "$restore/" "$live/"
              rm -rf "$restore"
              chmod -R u+rwX,go+rX "$live" 2>/dev/null || true
              sudo -n systemctl restart ai-endurance-coach.service 2>/dev/null || sudo -n systemctl restart ai-endurance-coach || true
              echo "Rollback restored successfully."
            fi
            rm -rf "$stage"
            rm -f "$bundle" "$checksum"
            exit "$exit_code"
          }
          trap rollback EXIT

          # 2. Ekstrak bundle ke direktori staging
          tar -xzf "$bundle" -C "$stage"
          test -s "$stage/index.html" || { echo "::error::Staged index.html is missing"; exit 1; }

          # 3. Snapshot backup versi aktif saat ini (tanpa menimpa runtime venv/.env)
          if [ "$(ls -A "$live" 2>/dev/null)" ]; then
            echo "Creating snapshot backup of current live release..."
            backup_exit=0
            tar --exclude='./venv' --exclude='./.venv' --exclude='./.env' --exclude='./node_modules' --warning=no-file-changed -czf "$backup" -C "$live" . || backup_exit=$?
            if [ "$backup_exit" -ne 0 ] && [ "$backup_exit" -ne 1 ]; then
              echo "::error::Backup snapshot failed with fatal exit code: $backup_exit"
              exit "$backup_exit"
            fi
            tar -tzf "$backup" > /dev/null || { echo "::error::Backup archive verification failed"; exit 1; }
          fi

          # 4. Sinkronisasi rsync ke live directory
          rsync -a --delete \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='venv' \
            --exclude='.venv' \
            --exclude='node_modules' \
            --exclude='.git' \
            "$stage/" "$live/"

          chmod -R u+rwX,go+rX "$live" 2>/dev/null || true
          test -s "$live/index.html" || { echo "::error::Live index.html is missing"; exit 1; }

          # 5. Restart application service jika tersedia
          if command -v systemctl >/dev/null 2>&1; then
            if sudo -n systemctl is-active --quiet ai-endurance-coach.service 2>/dev/null || sudo -n systemctl list-unit-files ai-endurance-coach.service 2>/dev/null; then
              echo "Restarting ai-endurance-coach service..."
              sudo -n systemctl restart ai-endurance-coach.service || true
            fi
          fi

          rm -f "$bundle" "$checksum"
          rm -rf "$stage"
          deploy_success=1
          echo "Deployment successfully applied to $live (Release: $release)"
          REMOTE

      - name: Strict TLS production health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
          BASE_PATH: ${{ inputs.base_path || env.DEFAULT_BASE_PATH }}
        run: |
          set -euo pipefail
          TARGET_URL="${PUBLIC_URL:-https://${VPS_HOST}:8445${BASE_PATH}}"
          echo "Running health check against $TARGET_URL ..."
          TMP_HEADER=$(mktemp)
          TMP_BODY=$(mktemp)
          if ! curl -k -s -S -L --max-time 15 --dump-header "$TMP_HEADER" -o "$TMP_BODY" "$TARGET_URL"; then
            echo "::error::Health check failed: Network connection, DNS, or HTTP connection failed for $TARGET_URL"
            rm -f "$TMP_HEADER" "$TMP_BODY"
            exit 1
          fi
          FINAL_STATUS=$(awk '/^HTTP/{status=$2} END{print status}' "$TMP_HEADER")
          echo "Final HTTP status: $FINAL_STATUS"
          if [ "$FINAL_STATUS" -ne 200 ]; then
            echo "::error::Health check failed: Expected HTTP 200, got $FINAL_STATUS"
            rm -f "$TMP_HEADER" "$TMP_BODY"
            exit 1
          fi
          if ! grep -qi 'Goalie' "$TMP_BODY"; then
            echo "::error::Health check failed: Body does not contain Goalie application"
            rm -f "$TMP_HEADER" "$TMP_BODY"
            exit 1
          fi
          echo "Health check PASSED!"
          rm -f "$TMP_HEADER" "$TMP_BODY"

      - name: Rollback if health check fails
        if: failure() && steps.deploy.outcome == 'success'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ env.ACTIVE_VPS_PORT || secrets.VPS_SSH_PORT || '22' }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          echo "Health check failed. Executing remote rollback on VPS..."
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "bash -s -- '${{ env.VPS_TARGET_DIR }}' '${{ env.APP_SLUG }}' '${RELEASE_SHA}'" <<'REMOTE'
          set -Eeuo pipefail
          live="$1"
          slug="$2"
          release="$3"
          parent="$HOME/.deploy-$slug"
          backup="$parent/backup-$release.tar.gz"
          if [ -s "$backup" ]; then
            restore="$parent/restore-$release"
            rm -rf "$restore"
            mkdir -p "$restore"
            tar -xzf "$backup" -C "$restore"
            rsync -a --delete \
              --exclude='.git' \
              --exclude='venv' \
              --exclude='.venv' \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='node_modules' \
              --exclude='__pycache__' \
              --exclude='.runtime' \
              "$restore/" "$live/"
            rm -rf "$restore"
            chmod -R u+rwX,go+rX "$live" 2>/dev/null || true
            sudo -n systemctl restart ai-endurance-coach.service 2>/dev/null || true
            echo "Rollback restored successfully."
          else
            echo "::error::No backup archive found at $backup to restore."
            exit 1
          fi
          REMOTE

      - name: Output deployment summary
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          BASE_PATH: ${{ inputs.base_path || env.DEFAULT_BASE_PATH }}
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### 🚀 Deployment Report: ${{ env.APP_SLUG }}
          - **Commit**: \`${{ github.sha }}\`
          - **Event**: \`${{ github.event_name }}\`
          - **Target**: \`${VPS_HOST}:${{ env.VPS_TARGET_DIR }}\`
          - **Base Path**: \`${BASE_PATH}\`
          - **Status**: ${{ job.status == 'success' && '✅ Verified Healthy' || '❌ Failed' }}
          EOF
