name: Build Mobile Apps (APK & IPA) and Sync to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Build Android APK
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Android with Capacitor
        run: npx cap sync android

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compile Android APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk app-latest.apk
          ls -la app-latest.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-latest-android-apk
          path: app-latest.apk
          retention-days: 14

      - name: Send APK to VPS via SCP
        if: ${{ env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${VPS_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -P "${VPS_PORT}" -o StrictHostKeyChecking=no app-latest.apk "${VPS_USERNAME}@${VPS_HOST}:${VPS_TARGET_DIR}/app-latest.apk"
          echo "Successfully uploaded app-latest.apk to VPS (${VPS_TARGET_DIR}/app-latest.apk)"

      - name: Notice if VPS Credentials are missing
        if: ${{ env.VPS_HOST == '' || env.VPS_SSH_KEY == '' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "::notice::VPS_HOST or VPS_SSH_KEY secret is not set. Skipped VPS transfer. Download the APK from Artifacts tab."

  # -------------------------------------------------------------
  # Job 2: Build iOS IPA (Unsigned)
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync iOS with Capacitor
        run: npx cap sync ios

      - name: Install Pods
        run: |
          cd ios/App
          pod install

      - name: Archive Xcode Project (Unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Extract Payload and Package IPA
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r app-latest.ipa Payload
          ls -la app-latest.ipa

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-latest-ios-ipa
          path: app-latest.ipa
          retention-days: 14

      - name: Send IPA to VPS via SCP
        if: ${{ env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${VPS_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -P "${VPS_PORT}" -o StrictHostKeyChecking=no app-latest.ipa "${VPS_USERNAME}@${VPS_HOST}:${VPS_TARGET_DIR}/app-latest.ipa"
          echo "Successfully uploaded app-latest.ipa to VPS (${VPS_TARGET_DIR}/app-latest.ipa)"

      - name: Notice if VPS Credentials are missing
        if: ${{ env.VPS_HOST == '' || env.VPS_SSH_KEY == '' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "::notice::VPS_HOST or VPS_SSH_KEY secret is not set. Skipped VPS transfer. Download the IPA from Artifacts tab."
