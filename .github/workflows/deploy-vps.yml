name: Deploy Goalie API to VPS

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - '*.py'
      - '*.html'
      - '*.json'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'scripts/**'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to VPS after validation; leave false for build-only checks'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: goalie-api-production
  cancel-in-progress: false

jobs:
  validate:
    name: Build and validate Goalie API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile API modules
        run: python -m compileall -q app
      - name: Build PWA bundle
        run: |
          npm ci
          npm run build
          test -s dist/index.html
          test -s dist/manifest.json
          test -s dist/sw.js
      - name: Build production container as an additional packaging check
        run: docker build -t goalie-engine:ci .

  deploy:
    name: Deploy to existing systemd service with rollback
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source without VPS runtime files
        run: |
          set -euo pipefail
          pkg_tmp="${RUNNER_TEMP:-/tmp}/goalie-pack-${GITHUB_SHA}"
          mkdir -p "$pkg_tmp"
          tar --exclude='.git' --exclude='node_modules' --exclude='venv' --exclude='.venv' --exclude='__pycache__' --exclude='.env' --exclude='.env.*' --exclude='.runtime' --exclude='android' --exclude='ios' --exclude='dist' -czf "$pkg_tmp/goalie-source.tar.gz" .
          mv "$pkg_tmp/goalie-source.tar.gz" goalie-source.tar.gz
          rm -rf "$pkg_tmp"
          tar -tzf goalie-source.tar.gz | grep -E '^(\./)?app/main.py$'
          tar -tzf goalie-source.tar.gz | grep -E '^(\./)?requirements.txt$'
      - name: Configure verified SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME || secrets.VPS_USER }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY || secrets.VPS_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "Missing secret VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing secret VPS_USERNAME (or VPS_USER)"; exit 1; }
          test -n "$VPS_KEY" || { echo "Missing secret VPS_SSH_KEY (or VPS_KEY)"; exit 1; }
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] && ((VPS_PORT > 0 && VPS_PORT < 65536)) || { echo "Invalid VPS_PORT"; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          # Use user-provided secret or pinned trusted known_hosts for verified host authenticity
          KNOWN_HOSTS="${VPS_SSH_KNOWN_HOSTS:-43.156.236.102 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPLV8FZsqrUwsNv4dydkY/O6XSpH5a/dMxCg0yHZHRkl
43.156.236.102 ssh-rsa 
43.156.236.102 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBM3zFw1kUt4sQlQpW/06R/8VIHtFGVplFTtIhSLGIfwgzlRRQsuL1EIfEUO03sETgbG2xpu13IEhnJDD/flYaB4=}"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Upload release source
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME || secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o PubkeyAcceptedKeyTypes=+ssh-rsa -i "$HOME/.ssh/id_deploy" -P "$VPS_PORT" goalie-source.tar.gz "$VPS_USER@$VPS_HOST:goalie-source-${GITHUB_SHA}.tar.gz"
      - name: Deploy and health-check existing service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME || secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o PubkeyAcceptedKeyTypes=+ssh-rsa -i "$HOME/.ssh/id_deploy" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s -- '${GITHUB_SHA}'" <<'REMOTE'
          set -Eeuo pipefail
          release="$1"
          [[ "$release" =~ ^[0-9a-f]{40}$ ]] || exit 1
          live="/home/ubuntu/platform-repos/ai-endurance-coach"
          service="ai-endurance-coach.service"
          test -d "$live" && test ! -L "$live"
          test -s "$live/.env" || { echo "Existing runtime .env missing; refusing deployment."; exit 1; }
          sudo -n systemctl is-active "$service" >/dev/null
          test "$(sudo -n systemctl show -p WorkingDirectory --value "$service")" = "$live" || { echo "Service WorkingDirectory differs from expected deployment directory."; exit 1; }
          command -v rsync >/dev/null
          command -v curl >/dev/null
          venv="$live/venv"
          test -x "$venv/bin/python" || { echo "Expected existing Python virtual environment missing."; exit 1; }
          backup_root="$HOME/.deploy-goalie"
          stage="$backup_root/stage-$release"
          backup="$backup_root/backup-$release.tar.gz"
          archive="$HOME/goalie-source-$release.tar.gz"
          mkdir -p "$backup_root"
          test -s "$archive" && test ! -e "$stage" && test ! -e "$backup"
          mkdir "$stage"
          tar -xzf "$archive" -C "$stage"
          test -s "$stage/app/main.py" && test -s "$stage/requirements.txt"
          if ! cmp -s "$live/requirements.txt" "$stage/requirements.txt"; then
            echo "requirements.txt changed. Refusing automatic deployment because production venv dependency updates need a separate reviewed step."
            rm -rf "$stage"
            rm -f "$archive"
            exit 1
          fi
          tar --exclude='./.git' --exclude='./venv' --exclude='./.venv' --exclude='./.env' --exclude='./.env.*' --exclude='./node_modules' --exclude='./__pycache__' --exclude='./.runtime' -czf "$backup" -C "$live" .
          rollback() {
            status="${1:-$?}"
            trap - ERR
            if [ -s "$backup" ]; then
              restore="$backup_root/restore-$release"
              rm -rf "$restore"
              mkdir -p "$restore"
              tar -xzf "$backup" -C "$restore"
              rsync -a --delete --exclude='/.git/' --exclude='/venv/' --exclude='/.venv/' --exclude='/.env' --exclude='/.env.*' --exclude='/node_modules/' --exclude='/__pycache__/' --exclude='/.runtime/' "$restore/" "$live/"
              sudo -n systemctl restart "$service" || true
              rm -rf "$restore"
            fi
            rm -rf "$stage"
            rm -f "$archive"
            exit "$status"
          }
          trap 'rollback $?' ERR
          rsync -a --delete --exclude='/.git/' --exclude='/venv/' --exclude='/.venv/' --exclude='/.env' --exclude='/.env.*' --exclude='/node_modules/' --exclude='/__pycache__/' --exclude='/.runtime/' "$stage/" "$live/"
          sudo -n systemctl restart "$service"
          healthy=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/api/v1/health >/dev/null; then healthy=true; break; fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            echo "Health check failed; rolling back."
            rollback 1
          fi
          trap - ERR
          rm -rf "$stage"
          rm -f "$archive"
          echo "Deployment successful; health endpoint returned HTTP 200. Backup retained at $backup"
          REMOTE
